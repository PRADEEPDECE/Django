{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4">
            <h2 class="text-center mb-4 fw-bold">Create an Account</h2>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-custom w-100 mt-4">Sign Up</button>
            </form>
            <div class="text-center mt-4">
                <small>Already have an account? <a href="{% url 'login' %}" class="text-light fw-bold text-decoration-none">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
