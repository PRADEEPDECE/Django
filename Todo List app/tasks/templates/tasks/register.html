{% extends 'tasks/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h2 class="mb-4 fw-bold">Create Account</h2>
            <p class="text-muted mb-4">Start organizing your life with TodoApp.</p>
            
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button class="btn btn-primary btn-lg" type="submit">Sign Up</button>
                </div>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top">
                <p class="mb-0 text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Login instead</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
