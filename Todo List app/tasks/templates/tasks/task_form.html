{% extends 'tasks/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{% url 'task-list' %}" class="btn btn-link text-decoration-none text-muted p-0 me-3 fs-5">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h2 class="mb-0 fw-bold">{% if request.resolver_match.url_name == 'task-create' %}New Task{% else %}Edit Task{% endif %}</h2>
        </div>

        <div class="card p-4">
            <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                    <a href="{% url 'task-list' %}" class="btn btn-light px-4">Cancel</a>
                    <button class="btn btn-primary px-4" type="submit">Save Task</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
